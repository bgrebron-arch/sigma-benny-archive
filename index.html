<!DOCTYPE html>
<html>
<head>
    <title>3D Pixel jumper</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000;
        }
        #win-screen {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #0f0; font-size: 50px;
            text-align: center; text-shadow: 4px 4px 0 #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        Level: <span id="levelDisplay">1</span><br>
        Coins Left: <span id="coinDisplay">0</span>
    </div>
    <div id="win-screen">YOU WIN!</div>

<script>
// --- SETUP SCENE ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Sky Blue

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; // Enable shadows
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// --- GAME VARIABLES ---
let player, playerVel = new THREE.Vector3();
const PLAYER_SPEED = 0.15;
const JUMP_FORCE = 0.35;
const GRAVITY = 0.015;
let canJump = false;

let platforms = [];
let coins = [];
let currentLevelIndex = 0;
let isGameOver = false;

const keys = { w: false, a: false, s: false, d: false, space: false };

// --- LEVELS DATA ---
// Formatted as: platforms [x, y, z, width, height, depth], coins [x, y, z]
const levels = [
    {   // LEVEL 1: The Basics
        platforms: [
            [0, -1, 0, 10, 1, 20], // Main floor
            [0, 1, -8, 4, 1, 4]    // Step up
        ],
        coins: [
            [0, 0.5, 0],
            [0, 0.5, -5],
            [0, 2.5, -8]
        ]
    },
    {   // LEVEL 2: The Gap
        platforms: [
            [0, -1, 5, 6, 1, 6],   // Start
            [0, -1, -5, 6, 1, 6],  // Finish
            [0, 0, 0, 2, 0.5, 2]   // Tiny floating block in middle
        ],
        coins: [
            [0, 0.5, 5],
            [0, 1.5, 0],
            [0, 0.5, -5]
        ]
    },
    {   // LEVEL 3: Stairs
        platforms: [
            [0, -1, 10, 4, 1, 4], // Start
            [0, 0, 6, 3, 1, 3],
            [0, 1, 2, 3, 1, 3],
            [0, 2, -2, 3, 1, 3],
            [0, 3, -6, 8, 1, 4]   // Top
        ],
        coins: [
            [0, 0.5, 10],
            [0, 1.5, 6],
            [0, 2.5, 2],
            [0, 3.5, -2],
            [-2, 4.5, -6],
            [2, 4.5, -6]
        ]
    }
];

// --- INITIALIZATION ---
function createPlayer() {
    const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 }); // Green Player
    player = new THREE.Mesh(geometry, material);
    player.castShadow = true;
    scene.add(player);
}

function loadLevel(index) {
    if (index >= levels.length) {
        document.getElementById('win-screen').style.display = 'block';
        scene.remove(player);
        isGameOver = true;
        return;
    }

    // Clear old stuff
    platforms.forEach(p => scene.remove(p));
    coins.forEach(c => scene.remove(c));
    platforms = [];
    coins = [];

    // Reset Player
    player.position.set(0, 2, 10); // Start slightly in the air
    playerVel.set(0, 0, 0);

    const levelData = levels[index];
    document.getElementById('levelDisplay').innerText = index + 1;
    updateCoinUI(levelData.coins.length);

    // Build Platforms
    levelData.platforms.forEach(data => {
        const geo = new THREE.BoxGeometry(data[3], data[4], data[5]);
        const mat = new THREE.MeshLambertMaterial({ color: 0x808080 }); // Grey walls
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data[0], data[1], data[2]);
        mesh.receiveShadow = true;
        scene.add(mesh);
        platforms.push(mesh); // Store for collision
    });

    // Build Coins
    levelData.coins.forEach(data => {
        const geo = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
        const mat = new THREE.MeshPhongMaterial({ color: 0xFFD700 }); // Gold
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data[0], data[1], data[2]);
        scene.add(mesh);
        coins.push(mesh);
    });
}

function updateCoinUI(count) {
    document.getElementById('coinDisplay').innerText = count;
}

// --- INPUT HANDLERS ---
window.addEventListener('keydown', (e) => {
    if (e.key === 'w') keys.w = true;
    if (e.key === 'a') keys.a = true;
    if (e.key === 's') keys.s = true;
    if (e.key === 'd') keys.d = true;
    if (e.code === 'Space') keys.space = true;
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'w') keys.w = false;
    if (e.key === 'a') keys.a = false;
    if (e.key === 's') keys.s = false;
    if (e.key === 'd') keys.d = false;
    if (e.code === 'Space') keys.space = false;
});

// --- PHYSICS & COLLISION ---
function checkCollision(p, box) {
    // Simple AABB (Axis-Aligned Bounding Box) check
    const playerBox = new THREE.Box3().setFromObject(p);
    const platformBox = new THREE.Box3().setFromObject(box);
    return playerBox.intersectsBox(platformBox);
}

function update() {
    if (isGameOver) return;

    // 1. Apply Gravity
    playerVel.y -= GRAVITY;

    // 2. Horizontal Movement
    playerVel.x = 0;
    playerVel.z = 0;
    if (keys.w) playerVel.z = -PLAYER_SPEED;
    if (keys.s) playerVel.z = PLAYER_SPEED;
    if (keys.a) playerVel.x = -PLAYER_SPEED;
    if (keys.d) playerVel.x = PLAYER_SPEED;

    // 3. Jump
    if (keys.space && canJump) {
        playerVel.y = JUMP_FORCE;
        canJump = false;
    }

    // 4. Move X/Z & Collision
    player.position.x += playerVel.x;
    player.position.z += playerVel.z;
    
    // Check horizontal walls? (Skipped for simplicity, we mostly just jump ON things)

    // 5. Move Y & Collision (Ground Detection)
    player.position.y += playerVel.y;
    canJump = false; // Assume falling

    platforms.forEach(platform => {
        if (checkCollision(player, platform)) {
            // If falling down onto something
            if (playerVel.y < 0 && player.position.y > platform.position.y) {
                // Snap to top
                // Simple math: Platform Y + half height + player half height
                const surfaceY = platform.position.y + (platform.geometry.parameters.height / 2) + 0.4;
                
                // Only snap if we are close to the top (prevents snapping from inside)
                if (player.position.y >= surfaceY - 0.5) {
                    player.position.y = surfaceY;
                    playerVel.y = 0;
                    canJump = true;
                }
            }
        }
    });

    // 6. Coin Collection
    for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].rotation.y += 0.05; // Spin effect
        if (checkCollision(player, coins[i])) {
            scene.remove(coins[i]);
            coins.splice(i, 1);
            updateCoinUI(coins.length);
            
            // Level Complete?
            if (coins.length === 0) {
                currentLevelIndex++;
                setTimeout(() => loadLevel(currentLevelIndex), 500); // Small delay
            }
        }
    }

    // 7. Death (Fall off world)
    if (player.position.y < -10) {
        loadLevel(currentLevelIndex); // Restart level
    }

    // 8. Camera Follow
    camera.position.x = player.position.x;
    camera.position.y = player.position.y + 5;
    camera.position.z = player.position.z + 8;
    camera.lookAt(player.position);
}

function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

// Start Game
createPlayer();
loadLevel(0);
animate();

// Resize Handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
